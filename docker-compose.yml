services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: foreclosuredata
      POSTGRES_PASSWORD: foreclosuredata_dev_password
      POSTGRES_DB: foreclosuredata
    ports:
      - "5433:5432"
    volumes:
      - foreclosuredata_postgres_data:/var/lib/postgresql/data

volumes:
  foreclosuredata_postgres_data:
