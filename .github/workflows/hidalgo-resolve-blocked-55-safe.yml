name: Hidalgo Blocked-55 Safe Resolution Pass

# Phase 5 + Phase 6 of the 55-case publication-blocker triage: executes only
# the low-risk, evidence-backed resolutions (trustee/courthouse address
# corrections, stale false-positive review-task closures, one confirmed
# duplicate-event canonicalization). Defaults to dry_run=true (zero
# writes). Only set dry_run=false after the dry-run output has been
# reviewed and approved. See
# apps/web/scripts/ci-resolve-blocked-55-safe.mts.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = zero writes, print the plan only. false = execute the corrections."
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run blocked-55 safe resolution pass
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: pnpm --filter @foreclosuredata/web run resolve:blocked-55-safe:ci
