name: Check DIRECT_URL host (one-off, read-only)

# ONE-OFF: prints only the hostname/port of DATABASE_URL and DIRECT_URL
# (never credentials) to confirm the corrected DIRECT_URL secret now
# resolves to the same production host family as DATABASE_URL, and no
# longer points at the unrelated Supabase pooler. No DB connection is
# attempted -- pure string parsing, no schema/data touched. Deleted after
# use.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check DATABASE_URL / DIRECT_URL host (no DB connection)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: node apps/web/scripts/check-direct-url-host.mjs
