name: Bounded 50-Notice Batch Report

# One-off, read-only reporting workflow for the bounded 50-notice Hidalgo
# production batch (see hidalgo-select-target.yml and hidalgo-ingestion.yml
# production mode). Makes zero database writes and zero Anthropic API
# calls. See apps/web/scripts/ci-report-batch50.mts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run batch report (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm --filter @foreclosuredata/web run report:batch50:ci
