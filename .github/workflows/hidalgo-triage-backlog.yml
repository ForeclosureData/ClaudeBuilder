name: Hidalgo Manual-Review Backlog Triage

# Read-only classification of the manual-review backlog into
# QUICK_APPROVAL / MEANINGFUL_REVIEW / MISSING_DATA / NON_BLOCKING_ENRICHMENT.
# Zero database writes, zero Anthropic calls. See
# apps/web/scripts/ci-triage-review-backlog.mts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backlog triage (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm --filter @foreclosuredata/web run triage:review-backlog:ci
