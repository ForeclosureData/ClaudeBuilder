name: Hidalgo Blocked-55 Outcome Report

# Phase 7 + Phase 8 of the 55-case publication-blocker triage: recalculates
# investor-visible inventory after the safe resolution pass and separates
# the remaining review workload into PUBLICATION-BLOCKING / NON-BLOCKING QA
# / DUPLICATE-EVENT REVIEW. Read-only, zero writes, zero Anthropic calls.
# See apps/web/scripts/ci-report-blocked-55-outcome.mts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run blocked-55 outcome report (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pnpm --filter @foreclosuredata/web run report:blocked-55-outcome:ci
