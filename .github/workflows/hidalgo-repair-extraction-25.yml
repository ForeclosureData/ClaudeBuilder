name: Hidalgo Extraction/AI-Fallback Repair (25-notice verification)

# One-off, manually-triggered: re-runs deterministic + corrected AI-fallback
# extraction against ONLY the 25 notices from the fresh 25-notice
# production ingestion test, using their already-persisted rawText -- no
# new discovery, no re-download, no re-OCR, no new SourceDocument rows.
# Read-only against the database (reports metrics, does not write
# corrected values back). Bounded to a maximum of 9 real Anthropic calls,
# matching the number of notices that needed AI fallback in the original
# run.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  repair-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm --filter @foreclosuredata/foreclosure-core exec tsc --noEmit -p .
          pnpm --filter @foreclosuredata/web exec tsc --noEmit -p .

      - name: Run foreclosure-core test suite
        run: pnpm --filter @foreclosuredata/foreclosure-core test

      - name: Re-run extraction on the same 25 notices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm --filter @foreclosuredata/web run repair:extraction25
